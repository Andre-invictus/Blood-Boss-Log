<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Blood Esports | Boss & Combat Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Teko:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#050505;--panel:#0d0d0d;--card:#141414;--red:#da0000;--darkred:#660000;--text:#f5f5f5;--muted:#929292;--green:#00e676;--blue:#00b0ff;--yellow:#ffb300;--border:#292929}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,sans-serif;display:flex;flex-direction:column}button,input,select{font:inherit}button{cursor:pointer}header{position:relative;text-align:center;padding:28px 16px 22px;background:radial-gradient(circle at top,#1a0000,var(--bg) 78%);border-bottom:2px solid var(--red)}
    .logo{height:150px;max-width:min(85vw,520px);object-fit:contain;filter:drop-shadow(0 0 15px #da000055)}.admin-trigger{position:absolute;right:18px;top:18px}.btn{border:1px solid var(--red);background:var(--panel);color:var(--text);padding:10px 16px;border-radius:6px;font-weight:800}.btn:hover{background:#260000}.btn.primary{background:var(--red);border-color:var(--red)}.btn.green{background:var(--green);border-color:var(--green);color:#000}.btn.blue{background:var(--blue);border-color:var(--blue);color:#000}.btn:disabled{opacity:.55;cursor:wait}
    .statusbar{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;padding:10px 16px;background:#090909;border-bottom:1px solid var(--border);font-size:.82rem;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--yellow);margin-right:6px}.dot.ok{background:var(--green)}.dot.error{background:var(--red)}
    nav{max-width:1240px;margin:18px auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:0 16px}.nav-btn{background:var(--panel);color:var(--muted);border:1px solid var(--border);padding:9px 17px;border-radius:6px;font:italic 1.25rem Teko,sans-serif;text-transform:uppercase;letter-spacing:1px}.nav-btn:hover,.nav-btn.active{color:#fff;border-color:var(--red)}.nav-btn.active{background:var(--red)}
    main{width:100%;max-width:1200px;margin:auto;padding:0 20px 42px;flex:1}.title{font:italic 2.1rem Teko,sans-serif;border-bottom:2px solid var(--border);padding-bottom:7px;margin:0 0 18px;display:flex;align-items:end;justify-content:space-between}.updated{font:400 .78rem Inter;color:var(--muted)}
    .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.metric{background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:13px}.metric small{display:block;color:var(--muted);margin-bottom:5px}.metric strong{font:italic 1.55rem Teko;color:#fff}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:13px}.card,.row{background:var(--card);border:1px solid var(--border);border-left:4px solid #444;border-radius:7px}.card{padding:16px}.card.next{border-left-color:var(--yellow)}.card.window{border-left-color:var(--red);background:linear-gradient(90deg,#da000021,var(--card))}.card.stale{opacity:.7}.card-head,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.boss{font-weight:800}.tag{background:#252525;border-radius:4px;padding:3px 8px;font-size:.72rem}.timer{font:italic 2.35rem/1 Teko;margin:11px 0 5px}.sub{font-size:.8rem;color:var(--muted)}
    .list,.combat{display:flex;flex-direction:column;gap:8px}.row{padding:14px 18px}.rank{width:7%;font:italic 1.7rem Teko;color:var(--red)}.player{flex:1;font-weight:800}.stats{display:flex;gap:25px;font:italic 1.7rem Teko}.blue{color:var(--blue)}.red{color:var(--red)}.server{width:12%;font-weight:800}.killer{width:32%;color:var(--muted)}.date{width:30%;text-align:center;color:#5ab6ed}.rowtimer{width:24%;text-align:right;font:italic 1.8rem Teko}
    dialog{width:min(620px,94vw);max-height:90vh;overflow:auto;color:var(--text);background:var(--panel);border:1px solid var(--red);border-radius:9px;padding:24px;box-shadow:0 0 35px #da000055}dialog::backdrop{background:#000b}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog-head h2{font:italic 2rem Teko;color:var(--red);margin:0}.close{background:transparent;border:0;color:#aaa;font-size:1.6rem}.group{border:1px solid var(--border);border-radius:7px;background:#111;padding:15px;margin-top:15px}.group h3{font:italic 1.4rem Teko;margin:0 0 10px}.field{margin-bottom:10px}.field label{display:block;color:#aaa;font-size:.78rem;margin-bottom:4px}.field input,.field select{width:100%;padding:10px;background:#050505;border:1px solid var(--border);border-radius:5px;color:#fff}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tags{display:flex;flex-wrap:wrap;gap:7px;min-height:55px;margin:10px 0}.member-tag{background:var(--darkred);padding:6px 9px;border-radius:4px}.member-tag button{border:0;background:transparent;color:#ffb3b3;font-weight:800}.notice{padding:10px;border-radius:5px;background:#201a00;color:#ffd56a;font-size:.84rem}.hidden{display:none!important}footer{text-align:center;color:var(--muted);padding:25px;border-top:1px solid #1b1b1b}.coupon{background:var(--red);color:#fff;padding:5px 10px;border-radius:4px;font-weight:800}
    @media(max-width:760px){.logo{height:90px}.admin-trigger{position:static;margin-bottom:12px}.summary{grid-template-columns:1fr 1fr}.row{align-items:flex-start;flex-wrap:wrap}.server,.rank{width:auto}.killer,.date,.rowtimer{width:100%;text-align:left}.title{font-size:1.75rem}.updated{font-size:.68rem}.stats{gap:14px}}
  </style>
</head>
<body>
<header><button class="btn admin-trigger" id="adminOpen">Painel ADM</button><img class="logo" src="undefined_-_Imgur.png" alt="Blood Esports"></header>
<div class="statusbar"><span><i id="statusDot" class="dot"></i><b id="statusText">INICIANDO</b></span><span id="lastSync">Última sincronização: --</span></div>
<nav id="nav"></nav><main id="main"></main>
<footer>Apoie a guilda com o cupom <span class="coupon">xRasGhulx40</span></footer>
<dialog id="adminDialog">
 <div class="dialog-head"><h2>Painel Administrativo</h2><button class="close" id="adminClose" aria-label="Fechar">×</button></div>
 <div id="loginBox" class="group"><div class="notice">Login provisório. Na próxima etapa ele será substituído pelo Supabase.</div><div class="field"><label>Usuário</label><input id="adminUser" autocomplete="username"></div><div class="field"><label>Senha</label><input id="adminPass" type="password" autocomplete="current-password"></div><button class="btn primary" id="loginBtn">Entrar</button></div>
 <div id="configBox" class="hidden">
  <div class="group"><h3>Lançamento manual</h3><div class="field"><label>Membro</label><select id="manualNick"></select></div><div class="cols"><div class="field"><label>Roubou</label><input id="manualBlue" type="number" min="0" step="0.1" value="0.0"></div><div class="field"><label>Perdeu</label><input id="manualRed" type="number" min="0" step="0.1" value="0.0"></div></div><button class="btn green" id="scoreBtn">Lançar pontuação</button></div>
  <div class="group"><h3>Membros da guilda</h3><div class="field"><label>Novos nicks, separados por vírgula</label><input id="newNick"></div><button class="btn" id="addNickBtn">Adicionar</button><div id="tags" class="tags"></div><button class="btn green" id="saveMembersBtn">Salvar lista</button></div>
  <div class="group"><h3>Relatório PDF</h3><div class="cols"><div class="field"><label>Data inicial</label><input id="startDate" type="date"></div><div class="field"><label>Data final</label><input id="endDate" type="date"></div></div><button class="btn blue" id="reportBtn">Baixar relatório</button></div>
  <button class="btn" id="logoutBtn" style="margin-top:15px">Sair</button>
 </div>
</dialog>
<script>
'use strict';
const CONFIG={
  APPS_SCRIPT_URL:'https://script.google.com/macros/s/AKfycbw54moTbLdHNEbYUyDg_pHmd6viKnAD790EOsgzOSCwbOM-iIWrchIeYaiYeEc6QgGeAQ/exec',
  BOSS_ENDPOINT:'/api/bosses',
  REFRESH_MS:30000,
  STALE_MS:120000,
  LIVE_WINDOW_MS:2*60*60*1000
};
const RULES_MIN={'Selupan':2050,'Nightmare':2410,'Core Magriffy':5076,'Nix':6000,'Lord of Ferea':4320,'Lord Silvester':5588,'God of Darkness':4320};
const state={tab:'Roubo de Hunt',members:[],scores:[],bosses:[],dashboard:[],lastSync:null,connected:false,busy:false};
const $=s=>document.querySelector(s); const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function requestId(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2)}
async function api(action,params={}){const u=new URL(CONFIG.APPS_SCRIPT_URL);u.searchParams.set('action',action);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,String(v)));const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(j.success===false||j.status==='error')throw new Error(j.message||'Falha na operação');return j}
function setStatus(type,text){state.connected=type==='ok';$('#statusDot').className='dot '+type;$('#statusText').textContent=text}
function syncLabel(){const t=state.lastSync?new Date(state.lastSync).toLocaleTimeString('pt-BR'):'--';$('#lastSync').textContent='Última sincronização: '+t}
function parseBR(s){const m=String(s).match(/(\d{2})\/(\d{2})\/(\d{4})[^\d]+(\d{2}):(\d{2}):(\d{2})/);return m?new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5],+m[6]):null}
function fmtWindow(d){if(!(d instanceof Date)||isNaN(d))return 'N/A';const e=new Date(+d+10*60000);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' • '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' - '+e.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function timeState(ms){const abs=Math.abs(ms);if(ms<=-CONFIG.LIVE_WINDOW_MS)return{text:'ATRASADO',cls:'stale',order:3};if(ms<=0)return{text:'JANELA ABERTA',cls:'window',order:0};const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;return{text:(d?d+'d ':'')+[h,m,sec].map(x=>String(x).padStart(2,'0')).join(':'),cls:ms<=1800000?'next':'',order:ms<=1800000?1:2}}
function tabs(){return['Roubo de Hunt','Dashboard do Jogo','Visão Geral',...Object.keys(RULES_MIN)]}
function renderNav(){$('#nav').innerHTML=tabs().map(t=>`<button class="nav-btn ${t===state.tab?'active':''}" data-tab="${esc(t)}">${esc(t)}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;renderNav();render();if(state.tab==='Dashboard do Jogo')loadDashboard()})}
function header(){return `<div class="title"><span>${esc(state.tab.toUpperCase())}</span><span class="updated">Atualizado às ${new Date().toLocaleTimeString('pt-BR')}</span></div>`}
function render(){const main=$('#main'),now=Date.now();if(state.tab==='Roubo de Hunt'){main.innerHTML=header()+`<div class="combat">${state.scores.map((c,i)=>`<div class="row"><div class="rank">${i+1}º</div><div class="player">${esc(c.player)}</div><div class="stats"><span class="blue">${esc(c.blue||'0.0k')}</span><span class="red">${esc(c.red||'0.0k')}</span></div></div>`).join('')||'<p>Nenhum registro encontrado hoje.</p>'}</div>`;return}
if(state.tab==='Dashboard do Jogo'){main.innerHTML=header()+`<div class="combat">${state.dashboard.map((c,i)=>`<div class="row"><div class="rank">${i+1}º</div><div class="player">${esc(c.player)}</div><div class="stats"><span class="blue">${esc(c.blue)}</span><span class="red">${esc(c.red)}</span></div></div>`).join('')||'<p>Carregando dados do servidor...</p>'}</div>`;return}
const data=state.tab==='Visão Geral'?state.bosses:state.bosses.filter(x=>x.boss===state.tab);if(state.tab==='Visão Geral'){const sorted=[...data].sort((a,b)=>timeState(+a.spawnDate-now).order-timeState(+b.spawnDate-now).order||a.spawnDate-b.spawnDate),available=sorted.filter(x=>+x.spawnDate<=now&&now-(+x.spawnDate)<CONFIG.LIVE_WINDOW_MS).length,soon=sorted.filter(x=>+x.spawnDate>now&&+x.spawnDate-now<=1800000).length;main.innerHTML=header()+`<div class="summary"><div class="metric"><small>Próximo boss</small><strong>${esc(sorted.find(x=>+x.spawnDate>now)?.boss||'--')}</strong></div><div class="metric"><small>Janela aberta</small><strong>${available}</strong></div><div class="metric"><small>Até 30 minutos</small><strong>${soon}</strong></div><div class="metric"><small>Conexão</small><strong>${state.connected?'CONECTADO':'OFFLINE'}</strong></div></div><div class="grid">${sorted.slice(0,30).map(x=>{const ts=timeState(+x.spawnDate-now);return`<article class="card ${ts.cls}"><div class="card-head"><span class="boss">${esc(x.boss)}</span><span class="tag">${esc(x.server)}</span></div><div class="timer" data-spawn="${+x.spawnDate}">${ts.text}</div><div class="sub">Previsão: ${esc(fmtWindow(x.spawnDate))}</div></article>`}).join('')||'<p>Nenhum log de boss disponível.</p>'}</div>`;return}
main.innerHTML=header()+`<div class="list">${data.sort((a,b)=>a.spawnDate-b.spawnDate).map(x=>{const ts=timeState(+x.spawnDate-now);return`<div class="row ${ts.cls}"><div class="server">${esc(x.server)}</div><div class="killer">Última kill: <b>${esc(x.lastKiller)}</b></div><div class="date">${esc(fmtWindow(x.spawnDate))}</div><div class="rowtimer" data-spawn="${+x.spawnDate}">${ts.text}</div></div>`}).join('')||'<p>Nenhum registro para este boss.</p>'}</div>`}
function tick(){document.querySelectorAll('[data-spawn]').forEach(el=>el.textContent=timeState(+el.dataset.spawn-Date.now()).text);if(state.lastSync&&Date.now()-state.lastSync>CONFIG.STALE_MS)setStatus('error','DADOS DESATUALIZADOS')}
async function loadPublic(){try{setStatus('','SINCRONIZANDO');const j=await api('getPublicData');state.members=Array.isArray(j.members)?j.members:[];const scores=j.dailyScores||{};state.scores=Object.entries(scores).map(([player,v])=>({player,blue:v.blue,red:v.red}));state.members.forEach(n=>{if(!state.scores.some(s=>s.player.toLowerCase()===n.toLowerCase()))state.scores.push({player:n,blue:'0.0k',red:'0.0k'})});state.scores.sort((a,b)=>parseFloat(b.blue)-parseFloat(a.blue));state.lastSync=Date.now();setStatus('ok','CONECTADO');syncLabel();renderMembers();render()}catch(e){setStatus('error','SEM CONEXÃO');console.error(e)}}
async function loadBosses(){try{const r=await fetch(CONFIG.BOSS_ENDPOINT,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const text=await r.text(),doc=new DOMParser().parseFromString(text,'text/html'),latest={};doc.querySelectorAll('table tbody tr').forEach(row=>{const c=row.querySelectorAll('td');if(c.length<5)return;const kill=parseBR(c[0].textContent.trim()),boss=c[1].textContent.trim(),player=c[2].textContent.trim(),server=c[3].textContent.trim();if(!kill||!RULES_MIN[boss])return;const key=boss+'|'+server;if(!latest[key])latest[key]={boss,server,lastKiller:player,killDate:kill,spawnDate:new Date(+kill+RULES_MIN[boss]*60000)}});state.bosses=Object.values(latest);render()}catch(e){console.error('Bosses:',e)}}
async function loadDashboard(){try{const r=await fetch('/api/dashboard',{cache:'no-store'});if(!r.ok)throw Error();const j=await r.json();state.dashboard=Array.isArray(j)?j:(j.data||[]);render()}catch(e){console.warn('Dashboard indisponível');render()}}
function renderMembers(){const s=$('#manualNick');s.innerHTML=state.members.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');$('#tags').innerHTML=state.members.map((n,i)=>`<span class="member-tag">${esc(n)} <button data-remove="${i}" aria-label="Remover">×</button></span>`).join('');document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.members.splice(+b.dataset.remove,1);renderMembers()})}
async function busy(btn,fn){if(state.busy)return;state.busy=true;const old=btn.textContent;btn.disabled=true;btn.textContent='Processando...';try{await fn()}catch(e){alert(e.message||'Falha na operação')}finally{btn.disabled=false;btn.textContent=old;state.busy=false}}
$('#adminOpen').onclick=()=>$('#adminDialog').showModal();$('#adminClose').onclick=()=>$('#adminDialog').close();
$('#loginBtn').onclick=()=>busy($('#loginBtn'),async()=>{const j=await api('login',{user:$('#adminUser').value,pass:$('#adminPass').value});if(!j.success)throw Error('Usuário ou senha incorretos');sessionStorage.setItem('blood_admin','1');$('#loginBox').classList.add('hidden');$('#configBox').classList.remove('hidden')});
$('#logoutBtn').onclick=()=>{sessionStorage.removeItem('blood_admin');$('#configBox').classList.add('hidden');$('#loginBox').classList.remove('hidden')};
$('#addNickBtn').onclick=()=>{const vals=$('#newNick').value.split(',').map(x=>x.trim()).filter(Boolean);vals.forEach(n=>{if(!state.members.some(x=>x.toLowerCase()===n.toLowerCase()))state.members.push(n)});$('#newNick').value='';renderMembers()};
$('#saveMembersBtn').onclick=()=>busy($('#saveMembersBtn'),async()=>{await api('updateMembers',{nicks:state.members.join(','),requestId:requestId()});alert('Lista salva com sucesso');await loadPublic()});
$('#scoreBtn').onclick=()=>busy($('#scoreBtn'),async()=>{await api('addManualDelta',{nick:$('#manualNick').value,blue:$('#manualBlue').value,red:$('#manualRed').value,requestId:requestId()});$('#manualBlue').value='0.0';$('#manualRed').value='0.0';alert('Pontuação lançada');await loadPublic()});
$('#reportBtn').onclick=()=>busy($('#reportBtn'),async()=>{const j=await api('downloadPDF',{startDate:$('#startDate').value,endDate:$('#endDate').value});if(!j.pdfBase64)throw Error('PDF não recebido');const a=document.createElement('a');a.href='data:application/pdf;base64,'+j.pdfBase64;a.download=`Relatorio_Hunt_${$('#startDate').value||'Inicio'}_${$('#endDate').value||'Hoje'}.pdf`;a.click()});
function init(){if(sessionStorage.getItem('blood_admin')==='1'){$('#loginBox').classList.add('hidden');$('#configBox').classList.remove('hidden')}renderNav();render();loadPublic();loadBosses();setInterval(tick,1000);setInterval(loadPublic,CONFIG.REFRESH_MS);setInterval(loadBosses,CONFIG.REFRESH_MS)}
init();
</script>
</body>
</html>
