</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<section id="login"><form class="login-card" id="loginForm"><img src="undefined_-_Imgur.png" alt="Blood Esports"><h1>ACESSO RESTRITO</h1><p>Entre com a conta autorizada.</p><div class="field"><label>E-mail</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Senha</label><input id="password" type="password" minlength="8" required autocomplete="current-password"></div><div id="loginMsg" class="msg"></div><button id="loginBtn" class="btn primary">Entrar</button><button id="forgot" class="link" type="button">Esqueci minha senha</button></form></section>

<script>
'use strict';const SUPA_URL='https://esysuyjparcthlfxdpks.supabase.co',SUPA_KEY='sb_publishable_p1obVXsYWqvhfjHTnAYaCA_21ZHCSHH',APP_URL='https://script.google.com/macros/s/AKfycbwDt0H24yyS_Ci-27bqeUC2HoRP8tR4ctPAomRUaxt_5KGyBwF4lsmnkM3TVoT_eQU0QA/exec';const sb=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=s=>document.querySelector(s),S={tab:'Roubo de Hunt',members:[],scores:[],bosses:[],profile:null,busy:false},RULES={'Selupan':2050,'Nightmare':2410,'Core Magriffy':5076,'Nix':6000,'Lord of Ferea':4320,'Lord Silvester':5588,'God of Darkness':4320};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(t){$('#loginMsg').textContent=t;$('#loginMsg').classList.add('show')}async function profile(user){const{data,error}=await sb.from('profiles').select('*').eq('id',user.id).single();if(error)throw Error('Perfil de acesso não encontrado.');if(!data.active)throw Error('Conta desativada.');return data}async function accept(session){if(!session)return false;try{S.profile=await profile(session.user);$('#uname').textContent=S.profile.display_name||S.profile.email;$('#urole').textContent=S.profile.role;$('#userbar').classList.remove('hidden');if(['admin','officer'].includes(S.profile.role))$('#admOpen').classList.remove('hidden');$('#login').classList.add('hidden');document.documentElement.classList.remove('locked');start();return true}catch(e){await sb.auth.signOut();msg(e.message);return false}}$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginBtn').disabled=true;const{data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error)msg(error.message==='Invalid login credentials'?'E-mail ou senha inválidos.':error.message);else await accept(data.session);$('#loginBtn').disabled=false};$('#forgot').onclick=async()=>{const email=$('#email').value.trim();if(!email)return msg('Digite o e-mail primeiro.');const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:'https://blood-boss-log.vercel.app/reset-password.html'});msg(error?error.message:'Se a conta existir, o link será enviado.')};$('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function api(action,p={}){const u=new URL(APP_URL);u.searchParams.set('action',action);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u,{cache:'no-store'}),j=await r.json();if(j.success===false||j.status==='error')throw Error(j.message||'Falha');return j}function rid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}function state(ms){if(ms<=-7200000)return{t:'ATRASADO',c:''};if(ms<=0)return{t:'JANELA ABERTA',c:'live'};let s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;return{t:(d?d+'d ':'')+[h,m,x].map(v=>String(v).padStart(2,'0')).join(':'),c:ms<=1800000?'next':''}}function parseBR(x){let m=String(x).match(/(\d{2})\/(\d{2})\/(\d{4})[^\d]+(\d{2}):(\d{2}):(\d{2})/);return m?new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5],+m[6]):null}function title(){return`<div class="title"><span>${esc(S.tab.toUpperCase())}</span><span class="updated">Atualizado às ${new Date().toLocaleTimeString('pt-BR')}</span></div>`}function nav(){let tabs=['Roubo de Hunt','Visão Geral',...Object.keys(RULES)];$('#nav').innerHTML=tabs.map(t=>`<button class="tab ${t===S.tab?'active':''}" data-t="${esc(t)}">${esc(t)}</button>`).join('');document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;nav();render()})}function render(){let now=Date.now();if(S.tab==='Roubo de Hunt'){$('#main').innerHTML=title()+`<div class="combat">${S.scores.map((x,i)=>`<div class="row"><span class="rank">${i+1}º</span><span class="player">${esc(x.player)}</span><span class="stats"><b class="blue">${esc(x.blue)}</b><b class="red">${esc(x.red)}</b></span></div>`).join('')||'<p>Nenhum registro encontrado hoje.</p>'}</div>`;return}let d=S.tab==='Visão Geral'?S.bosses:S.bosses.filter(x=>x.boss===S.tab);$('#main').innerHTML=title()+`<div class="grid">${d.map(x=>{let z=state(+x.spawn-now);return`<article class="card ${z.c}"><div class="head"><b>${esc(x.boss)}</b><span class="tag">${esc(x.server)}</span></div><div class="timer" data-spawn="${+x.spawn}">${z.t}</div><div class="sub">Última kill: ${esc(x.killer)}</div></article>`}).join('')||'<p>Nenhum log disponível.</p>'}</div>`}function tick(){document.querySelectorAll('[data-spawn]').forEach(e=>e.textContent=state(+e.dataset.spawn-Date.now()).t)}function members(){ $('#nick').innerHTML=S.members.map(n=>`<option>${esc(n)}</option>`).join('');$('#tags').innerHTML=S.members.map((n,i)=>`<span class="member">${esc(n)} <button data-r="${i}">x</button></span>`).join('');document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.members.splice(+b.dataset.r,1);members()})}async function load(){try{$('#status').textContent='SINCRONIZANDO';let j=await api('getPublicData');S.members=j.members||[];S.scores=Object.entries(j.dailyScores||{}).map(([player,v])=>({player,blue:v.blue,red:v.red})).sort((a,b)=>parseFloat(b.blue)-parseFloat(a.blue));members();render();$('#dot').className='dot ok';$('#status').textContent='CONECTADO';$('#sync').textContent='Última sincronização: '+new Date().toLocaleTimeString('pt-BR')}catch(e){$('#dot').className='dot err';$('#status').textContent='SEM CONEXÃO'}}async function bosses(){try{let r=await fetch('/api/bosses',{cache:'no-store'}),doc=new DOMParser().parseFromString(await r.text(),'text/html'),o={};doc.querySelectorAll('table tbody tr').forEach(tr=>{let c=tr.querySelectorAll('td');if(c.length<5)return;let k=parseBR(c[0].textContent),b=c[1].textContent.trim(),srv=c[3].textContent.trim();if(!k||!RULES[b])return;let id=b+'|'+srv;if(!o[id])o[id]={boss:b,server:srv,killer:c[2].textContent.trim(),spawn:new Date(+k+RULES[b]*60000)}});S.bosses=Object.values(o);render()}catch(e){console.error(e)}}async function busy(btn,fn){if(S.busy)return;S.busy=true;btn.disabled=true;try{await fn()}catch(e){alert(e.message)}finally{btn.disabled=false;S.busy=false}}let started=false;function start(){if(started)return;started=true;nav();render();load();bosses();setInterval(tick,1000);setInterval(load,30000);setInterval(bosses,30000)}
$('#admOpen').onclick=()=>$('#admin').showModal();$('#admClose').onclick=()=>$('#admin').close();$('#addNick').onclick=()=>{$('#newNick').value.split(',').map(x=>x.trim()).filter(Boolean).forEach(n=>{if(!S.members.some(x=>x.toLowerCase()===n.toLowerCase()))S.members.push(n)});$('#newNick').value='';members()};$('#saveMembers').onclick=()=>busy($('#saveMembers'),async()=>{await api('updateMembers',{nicks:S.members.join(','),requestId:rid()});alert('Lista salva');load()});$('#score').onclick=()=>busy($('#score'),async()=>{await api('addManualDelta',{nick:$('#nick').value,blue:$('#blue').value,red:$('#red').value,requestId:rid()});alert('Pontuação lançada');load()});$('#report').onclick=()=>busy($('#report'),async()=>{let j=await api('downloadPDF',{startDate:$('#start').value,endDate:$('#end').value}),a=document.createElement('a');a.href='data:application/pdf;base64,'+j.pdfBase64;a.download='Relatorio_Hunt.pdf';a.click()});sb.auth.getSession().then(({data})=>accept(data.session).then(ok=>{if(!ok){$('#login').classList.remove('hidden');document.documentElement.classList.add('locked')}}));
