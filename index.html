<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Esports | Boss & Combat Radar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,800;1,800&family=Teko:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --bg-panel: #0d0d0d;
            --bg-card: #141414;
            --blood-red: #da0000;
            --blood-dark: #660000;
            --text-main: #f5f5f5;
            --text-muted: #888888;
            --live-green: #00e676;
            --combat-blue: #00b0ff;
            --unknown-grey: #444444;
            --border-color: #222222;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        header {
            width: 100%;
            background: radial-gradient(circle at top center, #1a0000 0%, var(--bg-dark) 80%);
            border-bottom: 2px solid var(--blood-red);
            padding: 30px 0 25px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 4px 20px rgba(218, 0, 0, 0.15);
        }

        .logo-container img { 
            height: 160px; 
            object-fit: contain; 
            filter: drop-shadow(0 0 15px rgba(218, 0, 0, 0.3));
            transition: all 0.3s ease;
        }

        @media (max-width: 768px) {
            .logo-container img { height: 90px; }
        }

        .admin-trigger {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: var(--bg-panel);
            border: 1px solid var(--blood-red);
            color: var(--blood-red);
            padding: 6px 14px;
            border-radius: 4px;
            font-family: 'Teko', sans-serif;
            font-size: 1.1rem;
            font-style: italic;
            cursor: pointer;
            transition: all 0.2s;
        }
        .admin-trigger:hover {
            background-color: var(--blood-red);
            color: #fff;
        }

        .admin-panel {
            display: none;
            opacity: 0;
            transform: translateY(-15px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            width: 100%; max-width: 550px;
            background-color: var(--bg-panel);
            border: 1px solid var(--blood-red);
            padding: 30px 25px;
            margin: 20px auto;
            border-radius: 6px;
            position: relative;
            box-shadow: 0 0 25px rgba(218,0,0,0.4);
            text-align: center;
        }
        
        .admin-panel.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        
        .close-admin {
            position: absolute;
            top: 12px;
            right: 15px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            font-weight: 800;
            cursor: pointer;
            transition: color 0.2s;
        }
        .close-admin:hover { color: var(--blood-red); }

        .admin-panel h3 { 
            font-family: 'Teko', sans-serif; 
            font-size: 2.2rem; 
            color: var(--blood-red); 
            font-style: italic; 
            margin-bottom: 20px; 
            text-align: center; 
        }

        .admin-panel input {
            width: 100%; background: #000; border: 1px solid var(--border-color);
            color: #fff; padding: 12px; margin-bottom: 15px; border-radius: 4px; 
            font-family: 'Inter', sans-serif; text-align: center;
        }

        .admin-btn {
            background-color: var(--blood-red); color: #fff; border: none;
            padding: 10px 25px; font-family: 'Teko', sans-serif; font-size: 1.3rem;
            font-style: italic; cursor: pointer; border-radius: 4px; display: inline-block;
            margin-top: 5px; transition: background 0.2s;
        }
        .admin-btn:hover { background-color: #ff1a1a; }

        .tags-container {
            display: flex; flex-wrap: wrap; gap: 8px; background: #000;
            border: 1px solid var(--border-color); padding: 10px; border-radius: 4px;
            min-height: 80px; max-height: 150px; overflow-y: auto; margin-bottom: 15px;
            text-align: left;
        }
        .tag {
            background-color: var(--blood-dark); color: #fff; padding: 5px 10px;
            border-radius: 4px; display: flex; align-items: center; gap: 8px;
            font-size: 0.9rem; font-weight: 600;
        }
        .tag-remove { cursor: pointer; color: #ff9999; font-weight: bold; }
        .tag-remove:hover { color: #fff; }

        .tag-input-wrapper { display: flex; gap: 10px; margin-bottom: 5px; }
        .tag-input-wrapper input { margin-bottom: 0; text-align: left; }
        
        .member-counter {
            text-align: right; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px; display: block;
        }

        .nav-container {
            width: 100%; max-width: 1200px; margin: 20px auto;
            display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; padding: 0 20px;
        }

        .nav-btn {
            background-color: var(--bg-panel); color: var(--text-muted);
            border: 1px solid var(--border-color); padding: 10px 20px;
            border-radius: 4px; font-family: 'Teko', sans-serif; font-size: 1.3rem;
            letter-spacing: 1.5px; cursor: pointer; transition: all 0.2s ease; 
            text-transform: uppercase; font-style: italic;
        }

        .nav-btn:hover { color: var(--text-main); border-color: var(--blood-red); background-color: #1a0000; }
        .nav-btn.active {
            background-color: var(--blood-red); color: #fff;
            border-color: var(--blood-red); box-shadow: 0 4px 15px rgba(218, 0, 0, 0.4);
        }

        main { width: 100%; max-width: 1200px; padding: 0 20px 40px 20px; flex: 1; }

        .section-title {
            font-family: 'Teko', sans-serif; font-size: 2.2rem; color: var(--text-main);
            margin-bottom: 20px; display: flex; justify-content: space-between;
            align-items: flex-end; border-bottom: 2px solid var(--border-color); padding-bottom: 10px;
            font-style: italic;
        }

        .last-update { font-family: 'Inter', sans-serif; font-size: 0.85rem; color: var(--text-muted); font-weight: 400; font-style: normal; }

        .overview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }

        .compact-card {
            background-color: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 6px; padding: 18px; display: flex; flex-direction: column;
            position: relative; overflow: hidden; border-left: 4px solid var(--border-color);
            transition: transform 0.2s ease;
        }
        .compact-card:hover { transform: translateY(-2px); border-color: #333; }
        .compact-card.live {
            border-left-color: var(--blood-red);
            background: linear-gradient(90deg, rgba(218,0,0,0.15) 0%, rgba(20,20,20,1) 100%);
            border-color: rgba(218,0,0,0.3);
        }
        .compact-card.unknown { border-left-color: var(--unknown-grey); opacity: 0.7; }

        .compact-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .boss-name { font-weight: 800; font-size: 1.15rem; color: #fff; }
        .server-tag { background-color: #222; color: #ccc; font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; font-weight: 800; letter-spacing: 1px; }

        .timer-big { font-family: 'Teko', sans-serif; font-size: 2.4rem; line-height: 1; color: var(--text-main); margin-bottom: 5px; font-style: italic; }
        .timer-big.live-text { color: var(--blood-red); animation: pulse-text 1.5s infinite; }
        .timer-big.unknown-text { color: var(--unknown-grey); font-size: 2rem; }

        .date-sub { font-size: 0.85rem; color: var(--text-muted); }
        .date-sub.prediction { color: #4AA3DF; font-weight: 600; }

        .server-list { display: flex; flex-direction: column; gap: 10px; }
        .server-row {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-card); border: 1px solid var(--border-color);
            padding: 15px 25px; border-radius: 6px; border-left: 4px solid #333;
            transition: transform 0.2s ease;
        }
        .server-row:hover { transform: translateX(5px); border-color: #333; }
        .server-row.live-row { border-color: rgba(218,0,0,0.5); border-left: 4px solid var(--blood-red); background-color: rgba(218,0,0,0.05); }
        .server-row.unknown-row { opacity: 0.7; border-left: 4px solid var(--unknown-grey); }

        .col-server { width: 15%; font-weight: 800; font-size: 1.3rem; color: #fff; }
        .col-killer { width: 30%; font-size: 0.95rem; color: var(--text-muted); }
        .col-killer span { color: var(--text-main); font-weight: 600; }
        .col-date { width: 30%; font-size: 0.9rem; color: #4AA3DF; text-align: center; font-weight: 600; }
        .col-timer { width: 25%; font-family: 'Teko', sans-serif; font-size: 2rem; text-align: right; font-style: italic; }
        .empty-row { opacity: 0.4; background-color: transparent; border-style: dashed; }

        .combat-table { display: flex; flex-direction: column; gap: 8px; }
        .combat-row {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-card); border: 1px solid var(--border-color);
            padding: 15px 25px; border-radius: 6px; border-left: 4px solid #333;
        }
        .combat-row:hover { border-color: #333; background-color: #181818; }
        .combat-rank { width: 10%; font-family: 'Teko', sans-serif; font-size: 1.8rem; color: var(--blood-red); font-style: italic; }
        .combat-player { width: 35%; font-weight: 800; font-size: 1.1rem; color: #fff; display: flex; align-items: center; }
        .combat-stats { width: 55%; display: flex; justify-content: flex-end; gap: 30px; font-family: 'Teko', sans-serif; font-size: 1.8rem; font-style: italic; }
        .stat-blue { color: var(--combat-blue); }
        .stat-red { color: var(--blood-red); }
        
        .status-offline {
            font-size: 0.95rem; font-family: 'Inter', sans-serif; font-style: normal; font-weight: 600; color: #777; text-align: right; width: 100%;
        }
        
        .section-separator {
            font-family: 'Teko', sans-serif; font-size: 1.4rem; color: var(--text-muted);
            margin: 20px 0 10px 0; border-bottom: 1px dashed var(--border-color); padding-bottom: 5px;
            text-transform: uppercase; font-style: italic; letter-spacing: 1px;
        }

        footer {
            margin-top: auto; padding: 30px 20px; width: 100%;
            background: linear-gradient(0deg, #050505 0%, #0a0a0a 100%);
            border-top: 1px solid #1a1a1a; display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .support-banner {
            background-color: var(--bg-panel); border: 1px solid var(--border-color);
            padding: 12px 30px; border-radius: 4px; display: flex; align-items: center;
            gap: 15px; font-size: 0.95rem; color: #999; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-transform: uppercase; font-style: italic; font-weight: 800; flex-wrap: wrap; justify-content: center;
        }
        .coupon-highlight {
            color: #fff; background-color: var(--blood-red); padding: 6px 16px;
            border-radius: 4px; font-weight: 800; letter-spacing: 1.5px;
            font-size: 1.1rem; box-shadow: 0 0 15px rgba(218,0,0,0.4);
        }
        .creator-link {
            color: #4AA3DF; text-decoration: none; font-weight: 800;
            transition: color 0.2s; border-bottom: 1px dashed #4AA3DF;
        }
        .creator-link:hover { color: #fff; border-bottom-color: #fff; }

        @keyframes pulse-text { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <button class="admin-trigger" onclick="toggleAdminPanel()">Painel ADM</button>
        <div class="logo-container">
            <img src="undefined_-_Imgur.png" alt="Blood Esports">
        </div>
    </header>

    <div class="admin-panel" id="adminPanel">
        <button class="close-admin" onclick="toggleAdminPanel()">×</button>
        <h3>Painel Administrativo</h3>
        
        <div id="loginSection">
            <input type="text" id="adminUser" placeholder="Usuário">
            <input type="password" id="adminPass" placeholder="Senha">
            <br>
            <button class="admin-btn" onclick="doLogin()">Entrar</button>
        </div>

        <div id="configSection" style="display:none; text-align: left;">
            <p style="color: #00e676; margin-bottom: 10px; font-weight: bold; text-align: center;">Sessão Ativa (Admin)</p>
            
            <div style="margin: 15px 0; background: #111; padding: 10px; border-radius: 4px; border: 1px solid #333; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <input type="checkbox" id="chkShowAll" onchange="toggleShowAll()" style="width: 20px; height: 20px; margin: 0; cursor: pointer;">
                <label for="chkShowAll" style="color: #fff; font-size: 0.95rem; cursor: pointer; user-select: none;">Mostrar TODOS do Dashboard (Global)</label>
            </div>

            <label style="font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 5px;">Adicionar Nicks (Cole separados por vírgula ou um por um):</label>
            <div class="tag-input-wrapper">
                <input type="text" id="newNickInput" placeholder="Ex: Nick1, Nick2..." onkeypress="handleNickKey(event)">
                <button class="admin-btn" style="margin-top:0;" onclick="addNickTag()">Adicionar</button>
            </div>
            <span class="member-counter" id="memberCounter">0 / 30 Membros Monitorados</span>

            <label style="font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 5px;">Membros na Lista:</label>
            <div class="tags-container" id="tagsContainer"></div>

            <div style="margin-top: 15px; display: flex; flex-direction: column; gap: 10px;">
                <button class="admin-btn" style="width:100%; background-color: #00e676; color:#000;" onclick="saveGuildNicks()">Salvar Alterações</button>
                
                <div style="display: flex; gap: 10px; align-items: center; margin-top: 5px;">
                    <input type="date" id="reportDate" style="margin-bottom:0; flex: 1; background: #000; border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 4px;">
                    <button class="admin-btn" style="width: auto; background-color: #00b0ff; margin-top:0;" onclick="downloadPDF()">Baixar PDF</button>
                </div>

                <button class="admin-btn" style="background-color: #555; margin-top: 10px;" onclick="doLogout()">Sair da Conta (Logout)</button>
            </div>
        </div>
    </div>

    <div class="nav-container" id="nav-container"></div>
    <main id="main-content"></main>

    <footer>
        <div class="support-banner">
            <span>Apoie a guilda com o cupom:</span>
            <span class="coupon-highlight">xRasGhulx40</span>
            <span style="color: #444;">|</span>
            <span>Interessou no site? <a class="creator-link" href="https://discord.com/users/patrulhadadiversao" target="_blank">Clique aqui para falar com o criador</a></span>
        </div>
    </footer>

    <script>
        // BLINDAGEM DE SEGURANÇA
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', event => {
            if (event.key === 'F12') event.preventDefault();
            if (event.ctrlKey && event.shiftKey && (event.key === 'I' || event.key === 'i' || event.key === 'J' || event.key === 'j' || event.key === 'C' || event.key === 'c')) event.preventDefault();
            if (event.ctrlKey && (event.key === 'U' || event.key === 'u')) event.preventDefault();
        });

        const SPREADSHEET_API = "https://script.google.com/macros/s/AKfycbyDgMO5DPFzg1aQe_ziysjy0SXO4H1WbDSsuj6uEjMmkR56-k0EyuGMGLbpauhZCJJl/exec"; 
        let guildMembersList = [];
        const MAX_MEMBERS = 30;

        const respawnRules = {
            "Selupan": 34.16667,
            "Nightmare": 40.16667,
            "Core Magriffy": 84.6,
            "Nix": 100,
            "Lord of Ferea": 72,
            "Lord Silvester": 93.13333,
            "God of Darkness": 72
        };

        const totalServers = 19;
        let allData = [];
        let combatData = [];
        let currentTab = 'Visão Geral';

        const dataDeHoje = new Date().toLocaleDateString('pt-BR');
        let dailyScores = JSON.parse(localStorage.getItem('blood_daily_scores_' + dataDeHoje)) || {};
        let globalBaseline = {}; 
        let lastGasSyncTime = 0; 
        let lastSyncState = {}; 
        let mostrarTodosDoDashboard = localStorage.getItem('blood_show_all') === 'true';

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('blood_admin_logged') === 'true') {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('configSection').style.display = 'block';
                document.getElementById('chkShowAll').checked = mostrarTodosDoDashboard;
                fetchMembersForAdmin();
            }
            fetchSheetScoresOnStart();
            renderUI();
        });

        async function fetchSheetScoresOnStart() {
            if (!SPREADSHEET_API || SPREADSHEET_API === "SUA_URL_DO_APPS_SCRIPT_AQUI") return;
            try {
                const res = await fetch(`${SPREADSHEET_API}?action=getPublicData`);
                const json = await res.json();
                if (json.members) guildMembersList = json.members.slice(0, MAX_MEMBERS);
                if (json.baseline) globalBaseline = json.baseline;
                
                if (json.dailyScores) {
                    const guildLower = guildMembersList.map(n => n.toLowerCase());
                    for (let n in json.dailyScores) {
                        dailyScores[n] = {
                            player: n,
                            blue: json.dailyScores[n].blue,
                            red: json.dailyScores[n].red,
                            isGuild: guildLower.includes(n.toLowerCase()),
                            isOnline: false
                        };
                    }
                    localStorage.setItem('blood_daily_scores_' + dataDeHoje, JSON.stringify(dailyScores));
                    processCombatArray();
                    renderUI();
                }
            } catch(e) {}
        }

        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            if (panel.classList.contains('show')) {
                panel.classList.remove('show');
                setTimeout(() => panel.style.display = 'none', 300);
            } else {
                panel.style.display = 'block';
                setTimeout(() => panel.classList.add('show'), 10);
            }
        }

        function toggleShowAll() {
            mostrarTodosDoDashboard = document.getElementById('chkShowAll').checked;
            localStorage.setItem('blood_show_all', mostrarTodosDoDashboard);
            processCombatArray();
            renderUI();
        }

        async function doLogin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            
            if(!SPREADSHEET_API || SPREADSHEET_API === "SUA_URL_DO_APPS_SCRIPT_AQUI") {
                if(user === "admin" && pass === "123456") {
                    localStorage.setItem('blood_admin_logged', 'true');
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('configSection').style.display = 'block';
                    document.getElementById('chkShowAll').checked = mostrarTodosDoDashboard;
                    renderTags();
                } else {
                    alert("Usuário ou senha incorretos!");
                }
                return;
            }

            try {
                const res = await fetch(`${SPREADSHEET_API}?action=login&user=${user}&pass=${pass}`);
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('blood_admin_logged', 'true');
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('configSection').style.display = 'block';
                    document.getElementById('chkShowAll').checked = mostrarTodosDoDashboard;
                    fetchMembersForAdmin();
                } else {
                    alert("Usuário ou senha incorretos!");
                }
            } catch(e) {
                alert("Erro ao conectar com a planilha.");
            }
        }

        function doLogout() {
            localStorage.removeItem('blood_admin_logged');
            document.getElementById('configSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('adminUser').value = '';
            document.getElementById('adminPass').value = '';
            alert("Sessão encerrada com sucesso!");
        }

        function handleNickKey(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addNickTag();
            }
        }

        function addNickTag() {
            const input = document.getElementById('newNickInput');
            const val = input.value.trim();
            if (val) {
                const parts = val.split(',');
                let addedAny = false;
                
                parts.forEach(part => {
                    const cleanNick = part.trim();
                    if (cleanNick && !guildMembersList.includes(cleanNick)) {
                        if (guildMembersList.length >= MAX_MEMBERS) {
                            alert(`O limite máximo do painel é de ${MAX_MEMBERS} membros.`);
                            return;
                        }
                        guildMembersList.push(cleanNick);
                        addedAny = true;
                    }
                });
                
                if(addedAny) {
                    input.value = '';
                    renderTags();
                }
            }
        }

        function removeNickTag(nick) {
            guildMembersList = guildMembersList.filter(item => item !== nick);
            renderTags();
        }

        function renderTags() {
            const container = document.getElementById('tagsContainer');
            const counter = document.getElementById('memberCounter');
            
            counter.innerText = `${guildMembersList.length} / ${MAX_MEMBERS} Membros Monitorados`;
            
            container.innerHTML = guildMembersList.map(nick => `
                <div class="tag">
                    <span>${nick}</span>
                    <span class="tag-remove" onclick="removeNickTag('${nick}')">×</span>
                </div>
            `).join('') || '<span style="color:#666; font-size:0.9rem;">Nenhum membro adicionado ainda.</span>';
        }

        async function fetchMembersForAdmin() {
            try {
                const res = await fetch(`${SPREADSHEET_API}?action=getPublicData`);
                const data = await res.json();
                if(data.members) {
                    guildMembersList = data.members.slice(0, MAX_MEMBERS);
                    renderTags();
                }
            } catch(e) {}
        }

        async function saveGuildNicks() {
            if(!SPREADSHEET_API || SPREADSHEET_API === "SUA_URL_DO_APPS_SCRIPT_AQUI") {
                alert("Nicks salvos localmente na sessão.");
                return;
            }
            const nicksStr = guildMembersList.join(',');
            try {
                const res = await fetch(`${SPREADSHEET_API}?action=updateMembers&nicks=${encodeURIComponent(nicksStr)}`);
                const data = await res.json();
                if (data.success) {
                    alert("Membros atualizados com sucesso na planilha!");
                    fetchDashboardCombat();
                }
            } catch(e) {
                alert("Erro ao salvar membros.");
            }
        }

        async function downloadPDF() {
            const dateVal = document.getElementById('reportDate').value;
            if(!SPREADSHEET_API || SPREADSHEET_API === "SUA_URL_DO_APPS_SCRIPT_AQUI") {
                alert("Configure a URL do Apps Script para gerar o relatório em PDF.");
                return;
            }
            try {
                const res = await fetch(`${SPREADSHEET_API}?action=downloadPDF&date=${dateVal}`);
                const data = await res.json();
                if (data.pdfBase64) {
                    const link = document.createElement('a');
                    link.href = 'data:application/pdf;base64,' + data.pdfBase64;
                    link.download = `Relatorio_Hunt_${dateVal || 'Geral'}.pdf`;
                    link.click();
                }
            } catch(e) {
                alert("Erro ao gerar PDF.");
            }
        }

        function parseBrazilianDate(dateString) {
            const match = dateString.match(/(\d{2})\/(\d{2})\/(\d{4})[^\d]+(\d{2}):(\d{2}):(\d{2})/);
            if (match) { return new Date(match[3], match[2] - 1, match[1], match[4], match[5], match[6]); }
            return new Date(); 
        }

        function formatSpawnWindow(dateObj) {
            if (isNaN(dateObj.getTime())) return "N/A";
            const day = String(dateObj.getDate()).padStart(2, '0');
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const h1 = String(dateObj.getHours()).padStart(2, '0');
            const m1 = String(dateObj.getMinutes()).padStart(2, '0');
            const endWindow = new Date(dateObj.getTime() + (10 * 60000));
            const h2 = String(endWindow.getHours()).padStart(2, '0');
            const m2 = String(endWindow.getMinutes()).padStart(2, '0');
            return `${day}/${month} • ${h1}:${m1} - ${h2}:${m2}`;
        }

        function processCombatArray() {
            let liveArray = [];
            const guildLower = guildMembersList.map(n => n.toLowerCase());
            for (let n in dailyScores) {
                const isGuildMember = guildLower.includes(n.toLowerCase());
                dailyScores[n].isGuild = isGuildMember;
                if (mostrarTodosDoDashboard || isGuildMember) {
                    liveArray.push(dailyScores[n]);
                }
            }
            if (liveArray.length > 0) {
                combatData = liveArray.sort((a, b) => parseFloat(b.blue.replace('k','')) - parseFloat(a.blue.replace('k','')));
            } else {
                combatData = [];
            }
        }

        async function fetchDashboardCombat() {
            const nowMs = new Date().getTime();
            
            try {
                if (SPREADSHEET_API && SPREADSHEET_API !== "SUA_URL_DO_APPS_SCRIPT_AQUI" && (nowMs - lastGasSyncTime > 10000)) {
                    fetch(`${SPREADSHEET_API}?action=getPublicData`)
                        .then(res => res.json())
                        .then(sheetJson => {
                            if (sheetJson.members) { guildMembersList = sheetJson.members.slice(0, MAX_MEMBERS); }
                            if (sheetJson.baseline) { globalBaseline = sheetJson.baseline; }
                            
                            if (sheetJson.dailyScores) {
                                const guildLower = guildMembersList.map(n => n.toLowerCase());
                                for (let n in sheetJson.dailyScores) {
                                    if (!dailyScores[n]) dailyScores[n] = {};
                                    dailyScores[n].player = n;
                                    dailyScores[n].blue = sheetJson.dailyScores[n].blue;
                                    dailyScores[n].red = sheetJson.dailyScores[n].red;
                                    dailyScores[n].isGuild = guildLower.includes(n.toLowerCase());
                                }
                                localStorage.setItem('blood_daily_scores_' + dataDeHoje, JSON.stringify(dailyScores));
                                processCombatArray();
                                renderUI();
                            }
                        }).catch(e => {});
                    lastGasSyncTime = nowMs;
                }

                const apiURL = 'https://dashboard.megamu.net/dashboard-s14/data1.4.php';
                const cacheBuster = '?t=' + nowMs;
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(apiURL + cacheBuster)}`;
                
                const response = await fetch(proxyUrl);
                
                if (response.ok) {
                    const proxyData = await response.json();
                    const rawJson = JSON.parse(proxyData.contents); 
                    
                    if (rawJson.events && rawJson.events.length > 0) {
                        const eventData = JSON.parse(rawJson.events[0].data);
                        const users = eventData.users;
                        const guildLower = guildMembersList.map(n => n.toLowerCase());

                        for (let n in dailyScores) {
                            if (dailyScores[n]) dailyScores[n].isOnline = false;
                        }

                        for (let nick in users) {
                            let currentBlue = users[nick][0];
                            let currentRed = users[nick][1];

                            if (!globalBaseline[nick]) {
                                globalBaseline[nick] = { blue: currentBlue, red: currentRed };
                                if (SPREADSHEET_API && SPREADSHEET_API !== "SUA_URL_DO_APPS_SCRIPT_AQUI") {
                                    fetch(`${SPREADSHEET_API}?action=setBaseline&nick=${encodeURIComponent(nick)}&blue=${currentBlue}&red=${currentRed}`).catch(e => {});
                                }
                            }

                            const isNaLista = guildLower.includes(nick.toLowerCase());
                            
                            if (mostrarTodosDoDashboard || isNaLista) {
                                const baselineBlue = globalBaseline[nick].blue;
                                const baselineRed = globalBaseline[nick].red;

                                const deltaBlue = currentBlue - baselineBlue;
                                const deltaRed = currentRed - baselineRed;

                                const displayBlue = (deltaBlue / 1000).toFixed(1);
                                const displayRed = (deltaRed / 1000).toFixed(1);
                                
                                if (!dailyScores[nick]) dailyScores[nick] = {};
                                dailyScores[nick].player = nick;
                                dailyScores[nick].blue = displayBlue + "k";
                                dailyScores[nick].red = deltaRed > 0 ? "-" + displayRed + "k" : "0.0k";
                                dailyScores[nick].isGuild = isNaLista;
                                dailyScores[nick].isOnline = true;

                                if (deltaBlue > 0 || deltaRed > 0) {
                                    const syncKey = `${deltaBlue}_${deltaRed}`;
                                    if (lastSyncState[nick] !== syncKey) {
                                        lastSyncState[nick] = syncKey; 
                                        if (SPREADSHEET_API && SPREADSHEET_API !== "SUA_URL_DO_APPS_SCRIPT_AQUI") {
                                            fetch(`${SPREADSHEET_API}?action=syncDelta&nick=${encodeURIComponent(nick)}&blue=${displayBlue}&red=${displayRed}`).catch(e => {});
                                        }
                                    }
                                }
                            }
                        }

                        localStorage.setItem('blood_daily_scores_' + dataDeHoje, JSON.stringify(dailyScores));
                        processCombatArray();
                    }
                }
            } catch(e) {
                console.error("Erro na leitura da API:", e);
            }
            
            renderUI();
        }

        async function fetchBossLogs() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);
                const response = await fetch('/api/bosses', { signal: controller.signal });
                clearTimeout(timeoutId);
                
                if (!response.ok) throw new Error("Erro no servidor");

                const htmlText = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                const rows = doc.querySelectorAll('table tbody tr');
                
                if (rows.length === 0) throw new Error("Tabela não encontrada");

                const latestKills = {};
                rows.forEach(row => {
                    const columns = row.querySelectorAll('td');
                    if (columns.length >= 5) {
                        const dateStr = columns[0].textContent.trim();
                        const bossName = columns[1].textContent.trim();
                        const killedBy = columns[2].textContent.trim();
                        const server = columns[3].textContent.trim();

                        if (respawnRules[bossName]) {
                            const uniqueKey = bossName + "_" + server;
                            if (!latestKills[uniqueKey]) {
                                const killDate = parseBrazilianDate(dateStr);
                                const respawnMs = respawnRules[bossName] * 60 * 60 * 1000;
                                const spawnDate = new Date(killDate.getTime() + respawnMs);
                                
                                latestKills[uniqueKey] = {
                                    boss: bossName, server: server,
                                    lastKiller: killedBy, killDate: killDate, spawnDate: spawnDate
                                };
                            }
                        }
                    }
                });

                allData = Object.values(latestKills).sort((a, b) => a.spawnDate - b.spawnDate);
                renderUI();
            } catch (error) {}
        }

        function formatTimeState(ms) {
            if (ms <= 0) {
                if (Math.abs(ms) > 7200000) return { text: "DESCONHECIDO", state: 'unknown' };
                return { text: "AO VIVO", state: 'live' };
            }
            let totalSeconds = Math.floor(ms / 1000);
            let days = Math.floor(totalSeconds / (3600 * 24));
            let hours = Math.floor((totalSeconds % (3600 * 24)) / 3600);
            let minutes = Math.floor((totalSeconds % 3600) / 60);
            let seconds = totalSeconds % 60;
            let timeString = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            if (days > 1) return { text: `${days}d ${timeString}`, state: 'waiting' };
            if (days === 1) return { text: `1d ${timeString}`, state: 'waiting' };
            return { text: timeString, state: 'waiting' };
        }

        function setupNavigation() {
            const nav = document.getElementById('nav-container');
            const tabs = ["Visão Geral", ...Object.keys(respawnRules), "Roubo de Hunt"];
            nav.innerHTML = tabs.map(tab => `<button class="nav-btn ${tab === currentTab ? 'active' : ''}" onclick="changeTab('${tab}')">${tab}</button>`).join('');
        }

        window.changeTab = function(tabName) {
            currentTab = tabName; setupNavigation(); renderUI();
        }

        function renderUI() {
            const main = document.getElementById('main-content');
            const now = new Date().getTime();
            const timeStr = new Date().toLocaleTimeString('pt-BR', { hour12: false });
            
            const headerHtml = `<div class="section-title"><span>${currentTab.toUpperCase()}</span><span class="last-update">Atualizado às ${timeStr}</span></div>`;

            if (currentTab === 'Visão Geral') {
                const sortedBosses = [...allData].sort((a, b) => a.spawnDate.getTime() - b.spawnDate.getTime());
                const topBosses = sortedBosses.slice(0, 12);
                
                const cardsHtml = topBosses.map(data => {
                    const diff = data.spawnDate.getTime() - now;
                    const timeData = formatTimeState(diff);
                    let subTextHtml = "";
                    if (timeData.state === 'live') { subTextHtml = "Organize a Party e procure no mapa!"; }
                    else if (timeData.state === 'unknown') { subTextHtml = `Última kill: ${formatSpawnWindow(data.killDate).split('•')[0]}`; }
                    else { subTextHtml = `Prev: <span class="prediction">${formatSpawnWindow(data.spawnDate)}</span>`; }

                    return `
                        <div class="compact-card ${timeData.state === 'live' ? 'live' : ''} ${timeData.state === 'unknown' ? 'unknown' : ''}">
                            <div class="compact-header"><span class="boss-name">${data.boss}</span><span class="server-tag">${data.server}</span></div>
                            <div class="timer-big ${timeData.state === 'live' ? 'live-text' : ''} ${timeData.state === 'unknown' ? 'unknown-text' : ''}">${timeData.text}</div>
                            <div class="date-sub">${subTextHtml}</div>
                        </div>
                    `;
                }).join('');
                main.innerHTML = headerHtml + `<div class="overview-grid">${cardsHtml}</div>`;
            } 
            else if (currentTab === 'Roubo de Hunt') {
                if (guildMembersList.length === 0 && !mostrarTodosDoDashboard) {
                    main.innerHTML = headerHtml + '<p style="color:#777; text-align:center; padding: 20px;">Nenhum membro da guilda cadastrado. Limite máximo: 30 membros.</p>';
                    return;
                }

                let onlineHtml = '';
                let offlineHtml = '';
                let rankCounterOnline = 1;
                let rankCounterOffline = 1;

                // SEPARAÇÃO: Apenas quem está ONLINE fica em cima
                let onlineList = combatData.filter(c => c.isOnline);
                // Quem está OFFLINE (mas tem registro ou faz parte da guilda) fica embaixo
                let offlineList = combatData.filter(c => !c.isOnline);

                // Adiciona membros cadastrados que ainda não pontualiaram na lista offline
                const processedNicks = new Set(combatData.map(c => c.player.toLowerCase()));
                guildMembersList.forEach(nick => {
                    if (!processedNicks.has(nick.toLowerCase())) {
                        offlineList.push({
                            player: nick,
                            blue: "0.0k",
                            red: "0.0k",
                            isGuild: true,
                            isOnline: false
                        });
                    }
                });

                // 1. MONTAGEM DO GRUPO ONLINE (EM CIMA)
                onlineList.forEach(c => {
                    const tagGlobal = !c.isGuild ? '<span style="font-size:0.75rem; color:#777; margin-left: 8px; font-weight: normal;">(Global)</span>' : '';
                    onlineHtml += `
                        <div class="combat-row">
                            <div class="combat-rank">${rankCounterOnline++}º</div>
                            <div class="combat-player"><span style="color:#00e676; font-size:10px; margin-right:6px;" title="Online no Jogo">●</span>${c.player} ${tagGlobal}</div>
                            <div class="combat-stats">
                                <span class="stat-blue">${c.blue || "0.0k"}</span>
                                <span class="stat-red">${c.red || "0.0k"}</span>
                            </div>
                        </div>
                    `;
                });

                // 2. MONTAGEM DO GRUPO OFFLINE (EMBAIXO)
                offlineList.forEach(c => {
                    const tagGlobal = !c.isGuild ? '<span style="font-size:0.75rem; color:#777; margin-left: 8px; font-weight: normal;">(Global)</span>' : '';
                    offlineHtml += `
                        <div class="combat-row" style="opacity: 0.55; border-left-color: var(--unknown-grey);">
                            <div class="combat-rank" style="color: var(--unknown-grey);">${rankCounterOffline++}º</div>
                            <div class="combat-player"><span style="color:#e57373; font-size:10px; margin-right:6px;" title="Offline">●</span>${c.player} ${tagGlobal}</div>
                            <div class="combat-stats">
                                <span class="stat-blue">${c.blue || "0.0k"}</span>
                                <span class="stat-red">${c.red || "0.0k"}</span>
                            </div>
                        </div>
                    `;
                });

                let finalTableHtml = '';
                if (onlineHtml !== '') {
                    finalTableHtml += `<div class="section-separator" style="color: var(--live-green);">Membros Online no Servidor</div>` + onlineHtml;
                }
                if (offlineHtml !== '') {
                    finalTableHtml += `<div class="section-separator" style="color: var(--text-muted); margin-top: 25px;">Membros Offline / Ociosos</div>` + offlineHtml;
                }

                main.innerHTML = headerHtml + `<div class="combat-table">${finalTableHtml}</div>`;
            }
            else {
                const bossData = allData.filter(d => d.boss === currentTab);
                bossData.sort((a, b) => a.spawnDate.getTime() - b.spawnDate.getTime());

                let rowsHtml = '';
                bossData.forEach(data => {
                    const diff = data.spawnDate.getTime() - now;
                    const timeData = formatTimeState(diff);
                    let dateColHtml = "";
                    if (timeData.state === 'live') { dateColHtml = "NASCENDO / VIVO"; }
                    else if (timeData.state === 'unknown') { dateColHtml = "Aguardando novo padrão"; }
                    else { dateColHtml = formatSpawnWindow(data.spawnDate); }

                    let color = "var(--text-main)";
                    if (timeData.state === 'live') color = "var(--blood-red)";
                    if (timeData.state === 'unknown') color = "var(--unknown-grey)";

                    rowsHtml += `
                        <div class="server-row ${timeData.state === 'live' ? 'live-row' : ''} ${timeData.state === 'unknown' ? 'unknown-row' : ''}">
                            <div class="col-server">${data.server}</div>
                            <div class="col-killer">Última Kill: <span>${data.lastKiller}</span></div>
                            <div class="col-date" style="color: ${timeData.state === 'unknown' ? 'var(--unknown-grey)' : ''}">${dateColHtml}</div>
                            <div class="col-timer" style="color: ${color}">${timeData.text}</div>
                        </div>
                    `;
                });

                if (rowsHtml === '') {
                    rowsHtml = `<div class="server-row empty-row"><div class="col-server">--</div><div class="col-killer">Nenhum log no sistema</div><div class="col-date">--/--</div><div class="col-timer" style="color: var(--text-muted)">--:--:--</div></div>`;
                }

                main.innerHTML = headerHtml + `<div class="server-list">${rowsHtml}</div>`;
            }
        }

        setupNavigation(); 
        fetchBossLogs();
        fetchDashboardCombat();

        setInterval(fetchBossLogs, 10 * 1000);
        setInterval(fetchDashboardCombat, 5 * 1000);
        setInterval(renderUI, 1000);
    </script>
</body>
