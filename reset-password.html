<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Redefinir senha | Blood Esports</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Teko:wght@600&display=swap" rel="stylesheet">
  <style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#260000,#050505 55%);color:#f5f5f5;font-family:Inter,sans-serif}.card{width:min(430px,94vw);background:#0d0d0d;border:1px solid #3a1515;border-top:3px solid #da0000;border-radius:12px;padding:28px;box-shadow:0 24px 80px #000}.brand{text-align:center}.brand img{height:105px;max-width:90%;object-fit:contain}.brand h1{font:italic 2rem Teko;margin:8px 0}.field{margin:16px 0}.field label{display:block;color:#aaa;font-size:.8rem;margin-bottom:5px}.field input{width:100%;padding:12px;background:#050505;border:1px solid #333;border-radius:6px;color:#fff}.btn{width:100%;padding:12px;border:0;border-radius:6px;background:#da0000;color:white;font-weight:800;cursor:pointer}.msg{display:none;margin:12px 0;padding:10px;border-radius:6px;background:#241010;color:#ffc1c1}.msg.show{display:block}.msg.ok{background:#082519;color:#9fffc7}a{color:#64c5ff}</style>
</head>
<body><main class="card"><div class="brand"><img src="undefined_-_Imgur.png" alt="Blood Esports"><h1>NOVA SENHA</h1></div><p>Defina uma nova senha com pelo menos 8 caracteres.</p><form id="form"><div class="field"><label>Nova senha</label><input id="password" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label>Confirmar nova senha</label><input id="confirm" type="password" minlength="8" required autocomplete="new-password"></div><div id="msg" class="msg"></div><button id="btn" class="btn">Atualizar senha</button></form><p><a href="/">Voltar ao login</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>'use strict';const client=window.supabase.createClient('https://esysuyjparcthlfxdpks.supabase.co','sb_publishable_p1obVXsYWqvhfjHTnAYaCA_21ZHCSHH',{auth:{detectSessionInUrl:true,persistSession:true}});const msg=document.querySelector('#msg');function show(t,ok=false){msg.textContent=t;msg.className='msg show'+(ok?' ok':'')}document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const p=document.querySelector('#password').value,c=document.querySelector('#confirm').value,b=document.querySelector('#btn');if(p!==c){show('As senhas não são iguais.');return}b.disabled=true;b.textContent='Atualizando...';const {error}=await client.auth.updateUser({password:p});if(error){show(error.message);b.disabled=false;b.textContent='Atualizar senha'}else{show('Senha atualizada. Redirecionando para o login.',true);setTimeout(async()=>{await client.auth.signOut();location.href='/'},1800)}};</script></body></html>
