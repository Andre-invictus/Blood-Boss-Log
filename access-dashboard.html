<style>
:root{--bg:#03070b;--glass:rgba(7,15,22,.78);--glass2:rgba(10,22,31,.9);--line:rgba(124,225,255,.16);--line2:rgba(124,225,255,.30);--text:#eefaff;--muted:#7590a1;--cyan:#35dcff;--blue:#0588ff;--green:#67ffad;--yellow:#ffd166;--red:#ff5273;--shadow:0 24px 70px rgba(0,0,0,.42)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,sans-serif}.hidden{display:none!important}button,input{font:inherit}.ambient{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(circle at 17% 12%,rgba(0,166,255,.12),transparent 30%),radial-gradient(circle at 82% 88%,rgba(0,255,174,.08),transparent 32%);mix-blend-mode:screen}.scanline{position:fixed;z-index:4;inset:0;pointer-events:none;opacity:.16;background:repeating-linear-gradient(180deg,transparent 0,transparent 3px,rgba(113,220,255,.045) 4px)}#login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#0c3241 0,#04090e 44%,#020406 100%)}.login-card{width:min(440px,92vw);padding:34px;border:1px solid var(--line2);border-radius:24px;background:linear-gradient(145deg,rgba(11,27,38,.94),rgba(4,9,14,.96));box-shadow:0 35px 100px #000,0 0 80px rgba(53,220,255,.08);position:relative;overflow:hidden}.login-card:before{content:'';position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,transparent,var(--cyan),transparent)}.login-brand{display:flex;align-items:center;gap:14px;margin-bottom:24px}.login-mark{width:50px;height:50px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(145deg,#05a9df,#064d75);font:700 1.4rem Teko;box-shadow:0 0 28px rgba(53,220,255,.26)}.login-brand h1{margin:0;font:600 2rem Teko;letter-spacing:.08em}.login-brand p{margin:0;color:var(--muted);font-size:.75rem}.login-card input{width:100%;padding:13px 14px;margin:7px 0;border:1px solid #203845;border-radius:11px;background:#040a0f;color:#fff;outline:none}.login-card input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(53,220,255,.1)}.primary-btn{width:100%;margin-top:10px;padding:13px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--cyan),#0879c7);color:#00131c;font-weight:900;cursor:pointer}.msg{min-height:18px;margin-top:10px;color:#ff91a5;font-size:.77rem}.shell{position:relative;width:100%;height:100%}.map-stage{position:absolute;inset:0;z-index:0}.map-stage:after{content:'';position:absolute;inset:0;z-index:500;pointer-events:none;box-shadow:inset 0 0 150px 45px #02060a}.leaflet-container{background:#03080c}.leaflet-tile{filter:brightness(1.35) contrast(1.08) saturate(.75) hue-rotate(160deg)}.leaflet-control-attribution{opacity:.35}.leaflet-control-zoom{border:1px solid var(--line2)!important;box-shadow:none!important}.leaflet-control-zoom a{background:#07131bcc!important;color:#bcefff!important;border-color:var(--line)!important}.live-marker{width:16px;height:16px;border-radius:50%;background:var(--green);border:2px solid #e8fff1;box-shadow:0 0 10px var(--green),0 0 28px var(--green)}.live-marker:before,.live-marker:after{content:'';position:absolute;inset:-7px;border:1px solid rgba(103,255,173,.55);border-radius:50%;animation:radar 2.1s infinite}.live-marker:after{animation-delay:1s}@keyframes radar{0%{transform:scale(.5);opacity:1}100%{transform:scale(2.3);opacity:0}}.topbar{position:absolute;z-index:10;left:18px;right:18px;top:16px;height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 18px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(90deg,rgba(5,13,19,.92),rgba(7,19,27,.78));backdrop-filter:blur(18px);box-shadow:var(--shadow)}.identity{display:flex;align-items:center;gap:13px}.symbol{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,#0bc7ef,#076ca7);color:#00131a;font:700 1.2rem Teko;box-shadow:0 0 25px rgba(53,220,255,.25)}.identity h1{margin:0;font:600 1.65rem Teko;letter-spacing:.12em;line-height:1}.identity small{display:block;color:var(--muted);font-size:.66rem;margin-top:3px}.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);margin-right:6px}.top-actions{display:flex;align-items:center;gap:10px}.clock{padding:9px 12px;border:1px solid var(--line);border-radius:11px;color:#a7c2cf;font-size:.72rem;background:rgba(3,10,15,.6)}.admin-pill{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:12px;background:rgba(15,34,46,.8);border:1px solid var(--line)}.admin-avatar{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:#0d627f;color:#c9f8ff;font:700 .85rem Teko}.admin-pill b{font-size:.75rem}.ghost-btn{border:1px solid var(--line2);background:rgba(5,16,23,.8);color:#dff8ff;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer}.ghost-btn:hover{border-color:var(--cyan);background:#0b2835}.kpi-rail{position:absolute;z-index:9;left:18px;top:96px;display:flex;gap:9px}.kpi{min-width:128px;padding:11px 13px;border:1px solid var(--line);border-radius:15px;background:var(--glass);backdrop-filter:blur(16px);box-shadow:0 12px 35px rgba(0,0,0,.25)}.kpi span{display:block;color:var(--muted);font-size:.59rem;text-transform:uppercase;letter-spacing:.1em}.kpi b{display:block;margin-top:2px;font:600 1.65rem Teko;line-height:1;color:#fff}.kpi.primary{border-color:rgba(103,255,173,.35)}.kpi.primary b{color:var(--green)}.side-panel{position:absolute;z-index:12;right:18px;top:96px;bottom:18px;width:350px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(5,14,21,.94),rgba(4,10,15,.92));backdrop-filter:blur(20px);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;transition:transform .35s ease,opacity .35s ease}.side-panel.collapsed{transform:translateX(calc(100% + 30px));opacity:0;pointer-events:none}.panel-head{padding:17px;border-bottom:1px solid var(--line)}.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.panel-title h2{margin:0;font:600 1.25rem Teko;letter-spacing:.08em}.count-chip{padding:4px 8px;border-radius:99px;background:rgba(103,255,173,.1);border:1px solid rgba(103,255,173,.25);color:var(--green);font-size:.62rem}.search-wrap{position:relative}.search-wrap input{width:100%;padding:11px 38px 11px 12px;border:1px solid var(--line);border-radius:11px;background:#03090e;color:#fff;outline:none}.search-wrap input:focus{border-color:var(--cyan)}.search-wrap span{position:absolute;right:12px;top:10px;color:var(--muted)}.online-list{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:8px}.person{position:relative;padding:12px 13px 12px 15px;border:1px solid rgba(118,194,223,.12);border-radius:13px;background:linear-gradient(145deg,rgba(12,28,38,.78),rgba(5,13,19,.78));cursor:pointer;transition:.18s}.person:before{content:'';position:absolute;left:-1px;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--green);box-shadow:0 0 10px var(--green)}.person:hover,.person.active{transform:translateX(-3px);border-color:rgba(53,220,255,.38);background:linear-gradient(145deg,rgba(10,47,62,.82),rgba(6,20,29,.84))}.person-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.person h4{margin:0;font-size:.82rem}.role-badge{padding:3px 7px;border:1px solid rgba(53,220,255,.22);border-radius:99px;background:rgba(53,220,255,.08);color:#9aeaff;font-size:.56rem;text-transform:uppercase}.person-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;color:#7895a5;font-size:.64rem}.person-location{margin-top:5px;color:#aac3cf;font-size:.66rem}.empty{padding:24px;text-align:center;border:1px dashed var(--line2);border-radius:13px;color:var(--muted);font-size:.72rem}.detail-card{position:absolute;z-index:14;left:50%;bottom:24px;transform:translateX(-50%);width:min(560px,calc(100% - 430px));padding:16px;border:1px solid rgba(53,220,255,.35);border-radius:18px;background:rgba(5,17,24,.94);backdrop-filter:blur(22px);box-shadow:0 30px 70px #000;animation:rise .28s ease}@keyframes rise{from{transform:translate(-50%,18px);opacity:0}}.detail-close{position:absolute;right:11px;top:10px;width:32px;height:32px;border:1px solid var(--line2);border-radius:10px;background:#071721;color:#aeefff;font-size:1.25rem;cursor:pointer}.detail-grid{display:grid;grid-template-columns:54px 1fr auto;gap:13px;align-items:center}.detail-avatar{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#086d8d,#07354d);font:700 1.25rem Teko}.detail-card h3{margin:0 36px 3px 0;font-size:1rem}.detail-card p{margin:3px 0;color:#88a3b2;font-size:.68rem}.detail-status{text-align:right}.detail-status b{display:block;color:var(--green);font:600 1.2rem Teko}.detail-status small{color:var(--muted);font-size:.6rem}.dock{position:absolute;z-index:11;left:18px;bottom:18px;display:flex;gap:8px}.dock-btn{width:44px;height:44px;border:1px solid var(--line);border-radius:14px;background:var(--glass);color:#bdefff;backdrop-filter:blur(15px);cursor:pointer;font-size:1rem}.dock-btn:hover{border-color:var(--cyan);background:#0b2a38}.insight{position:absolute;z-index:8;left:18px;bottom:74px;width:280px;padding:13px;border:1px solid var(--line);border-radius:15px;background:var(--glass);backdrop-filter:blur(16px)}.insight h3{margin:0 0 9px;font:600 1rem Teko;letter-spacing:.08em}.mini-bars{display:flex;flex-direction:column;gap:6px}.mini-row{display:grid;grid-template-columns:88px 1fr 25px;gap:7px;align-items:center;font-size:.58rem;color:#94adba}.mini-track{height:5px;border-radius:99px;background:#14232c;overflow:hidden}.mini-fill{height:100%;background:linear-gradient(90deg,#0788be,var(--cyan));border-radius:99px}@media(max-width:980px){.side-panel{width:320px}.kpi:nth-child(n+4){display:none}.detail-card{width:calc(100% - 380px)}}@media(max-width:700px){.topbar{left:10px;right:10px;top:10px}.identity small,.clock{display:none}.kpi-rail{left:10px;right:10px;top:88px;display:grid;grid-template-columns:1fr 1fr}.kpi{min-width:0}.kpi:nth-child(n+3){display:none}.side-panel{left:10px;right:10px;top:auto;bottom:10px;width:auto;height:42%;border-radius:18px}.insight,.dock{display:none}.detail-card{left:10px;right:10px;bottom:44%;width:auto;transform:none}.map-stage:after{box-shadow:inset 0 0 80px 20px #02060a}}
</style>
</head>
<body>
<div class="ambient"></div><div class="scanline"></div>
<section id="login"><form class="login-card"><div class="login-brand"><div class="login-mark">BA</div><div><h1>BLOOD ATLAS</h1><p>Central privada de presença em tempo real</p></div></div><input id="email" type="email" placeholder="E-mail administrativo" required><input id="password" type="password" placeholder="Senha" required><button class="primary-btn">Entrar no comando</button><div id="msg" class="msg"></div></form></section>
<div id="app" class="shell hidden">
  <div id="map" class="map-stage"></div>
  <header class="topbar"><div class="identity"><div class="symbol">BA</div><div><h1>BLOOD ATLAS</h1><small><span class="live-dot"></span>Rede ao vivo · presença global</small></div></div><div class="top-actions"><div id="liveClock" class="clock">--:--:--</div><div class="admin-pill"><div id="adminInitial" class="admin-avatar">A</div><b id="adminName"></b></div><button id="logout" class="ghost-btn">Sair</button></div></header>
  <section class="kpi-rail"><article class="kpi primary"><span>Online agora</span><b id="onlineUsers">0</b></article><article class="kpi"><span>Sessões ativas</span><b id="openSessions">0</b></article><article class="kpi"><span>Acessos hoje</span><b id="todaySessions">0</b></article><article class="kpi"><span>Únicos hoje</span><b id="todayUnique">0</b></article><article class="kpi"><span>Tempo médio</span><b id="avgDuration">0m</b></article></section>
  <aside id="sidePanel" class="side-panel"><div class="panel-head"><div class="panel-title"><h2>USUÁRIOS CONECTADOS</h2><span id="onlineCountChip" class="count-chip">0 ATIVOS</span></div><div class="search-wrap"><input id="search" placeholder="Buscar por display_name"><span>⌕</span></div></div><div id="onlineList" class="online-list"></div></aside>
  <section id="detail" class="detail-card hidden"></section>
  <section class="insight"><h3>PÁGINAS EM DESTAQUE</h3><div id="pageBars" class="mini-bars"></div><div id="locationBars" class="hidden"></div></section>
  <nav class="dock"><button id="worldView" class="dock-btn" title="Visão mundial">◎</button><button id="togglePanel" class="dock-btn" title="Mostrar ou ocultar usuários">☰</button></nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/access-dashboard.js?v=19"></script>
</body></html>
